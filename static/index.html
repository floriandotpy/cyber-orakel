<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Orakel</title>
    <link rel="stylesheet" href="static/style.css" />
    <link rel="stylesheet" href="static/loading.css" />
  </head>
  <body>
    <div class="logo">
      <img src="static/logo.png" alt="Cyber Orakel Logo" />
    </div>
    <div class="container">
      <div id="step-1">
        <h1 class="question">Was ist dein Cyber-Sternzeichen?</h1>
        <div id="step-1-content" class="grid">
          <!-- Buttons will be dynamically added here -->
        </div>
      </div>
      <div id="step-2" class="hidden">
        <h1 class="question">Hinterlasse Entropie für das Orakel nach dir</h1>
        <div id="step-2-content" class="grid">
          <!-- Select boxes will be dynamically added here -->
        </div>
        <div class="text-center">
          <button id="submit_entropy" class="button margin-top-small">
            Entropie speichern
          </button>
        </div>
      </div>
      <div id="step-badge" class="hidden">
        <h1 class="question">Möchtest du ein Cyber-Badge sammeln?</h1>
        <div class="text-center">
          <button id="badge-yes" class="button margin-top-small">
            Ja
          </button>
          <button id="badge-no" class="button margin-top-small">
            Nein, Danke (10 Sekunden)
          </button>
        </div>
      </div>
      <div id="loading" class="hidden">
        <h1 class="question">Das Orakel cybert, bitte warten</h1>
        <div class="loading-animation">CYBER IN PROGRESS...</div>
        <div class="text-center" style="margin-top: 2rem;">
          <video autoplay loop muted playsinline style="max-width: 50%; height: auto;">
            <source src="static/final_video.mp4" type="video/mp4">
            <source src="static/final_video.mov" type="video/quicktime">
            Dein Browser unterstützt das Video-Tag nicht.
          </video>
        </div>
      </div>
      <div id="step-qrcode" class="hidden">
        <h1 class="question">Scanne den QR-Code</h1>
        <div class="text-center">
          <img src="static/39c3-qrcode.png" alt="39C3 QR Code" style="max-width: 24%; height: auto;" />
        </div>
        <div class="text-center">
          <button id="qrcode-continue" class="button margin-top-small">
            Weiter
          </button>
        </div>
      </div>
      <div id="result" class="hidden">
        <h1 class="question">Die Sterne haben gesprochen</h1>
        <p id="fortune-result" class="fortune-result">
          <!-- Fortune will be dynamically added here-->
        </p>
        <div class="text-center">
          <button id="restart" class="button margin-top-small">
            Neu starten
          </button>
        </div>
      </div>
    </div>
    <script>
      const serverUrl = "http://localhost:8000";
      let fortune_text = "";
      let step_2_completed = false;
      let badgeCountdownInterval;
      let selected_zodiac = null; // Store selected zodiac

      function restart() {
        fortune_text = "";
        step_2_completed = false;
        selected_zodiac = null;
        document.getElementById("step-1").classList.remove("hidden");
        document.getElementById("result").classList.add("hidden");
      }

      async function fetchZodiacs() {
        const response = await fetch(`${serverUrl}/zodiacs`);
        const zodiacs = await response.json();
        return zodiacs;
      }

      function renderButtons(zodiacs) {
        const container = document.getElementById("step-1");
        const content = document.getElementById("step-1-content");
        content.innerHTML = ""; // Clear any existing buttons

        zodiacs.forEach((zodiac) => {
          const button = document.createElement("button");
          button.className = "button";
          button.innerText = zodiac.display_name;
          button.addEventListener("click", async function () {
            const sentiment = "random";
            selected_zodiac = zodiac.key; // Store selected zodiac

            const loadingEl = document.getElementById("loading");
            const step2El = document.getElementById("step-2");

            document.getElementById("step-1").classList.add("hidden");
            step2El.classList.remove("hidden");

            // Fetch entropy words for this zodiac
            fetchEntropyWords(zodiac.key).then(renderEntropyWords);

            const response = await fetch(
              `${serverUrl}/fortune?zodiac=${zodiac.key}&sentiment=${sentiment}`
            );
            const data = await response.json();
            fortune_text = data.fortune;

            displayFortuneIfAvailableAndStepTwoCompleted();
          });
          content.appendChild(button);
        });
      }

      function displayFortuneIfAvailableAndStepTwoCompleted() {
        if (fortune_text && step_2_completed) {
          // Fortune is ready, check if we should show QR code or result
          const badgeEl = document.getElementById("step-badge");
          const qrcodeEl = document.getElementById("step-qrcode");
          const loadingEl = document.getElementById("loading");

          // If badge is visible, do nothing (user hasn't answered yet)
          if (!badgeEl.classList.contains("hidden")) {
            return;
          }

          // If QR code is visible, do nothing (user is scanning)
          if (!qrcodeEl.classList.contains("hidden")) {
            return;
          }

          // Otherwise show result
          loadingEl.classList.add("hidden");
          showResult();
          startCountdown();
        }
      }

      function showResult() {
        const badgeEl = document.getElementById("step-badge");
        const qrcodeEl = document.getElementById("step-qrcode");
        const resultEl = document.getElementById("result");
        const restartEl = document.getElementById("restart");

        document.getElementById("fortune-result").innerText =
          "Deine Prophezeiung wurde gedruckt. Bitte mitnehmen.";
        badgeEl.classList.add("hidden");
        qrcodeEl.classList.add("hidden");
        resultEl.classList.remove("hidden");
        restartEl.classList.remove("hidden");
      }

      async function fetchEntropyWords(zodiac = null) {
        const url = zodiac
          ? `${serverUrl}/entropy_words?zodiac=${zodiac}`
          : `${serverUrl}/entropy_words`;
        const response = await fetch(url);
        const words = await response.json();
        return words;
      }

      function renderEntropyWords(words) {
        const content = document.getElementById("step-2-content");
        const submitButton = document.getElementById("submit_entropy");
        submitButton.disabled = true;
        submitButton.innerText = "Noch 3 auswählen";
        content.innerHTML = ""; // Clear any existing content

        words.forEach((word, index) => {
          const checkboxId = `checkbox-${index}`; // Einzigartige ID für jede Checkbox

          // Checkbox erstellen
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.id = checkboxId; // ID setzen
          checkbox.className = "checkbox"; // Styling-Klasse
          checkbox.value = word;
          checkbox.addEventListener("change", updateSubmitButton); // Event-Listener

          // Label erstellen
          const label = document.createElement("label");
          label.className = "select-button"; // Styling-Klasse für das Label
          label.setAttribute("for", checkboxId); // Mit der Checkbox verbinden
          label.textContent = word; // Text setzen

          // Wrapper erstellen und Elemente hinzufügen
          const wrapper = document.createElement("div"); // Optionaler Wrapper
          wrapper.style.display = "inline-block"; // Styling für Inline-Darstellung
          wrapper.appendChild(checkbox);
          wrapper.appendChild(label);

          // Wrapper ins DOM einfügen
          content.appendChild(wrapper);
        });

        // add button action
        submitButton.removeEventListener("click", handleButtonClick);
        submitButton.addEventListener("click", handleButtonClick);
      }

      async function handleButtonClick() {
        const content = document.getElementById("step-2-content");
        const selectedWords = Array.from(
          content.querySelectorAll('input[type="checkbox"]:checked')
        ).map((checkbox) => checkbox.value);

        const response = await fetch(`${serverUrl}/entropy`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ words: selectedWords }),
        });
        const data = await response.json();
        console.log(data);

        step_2_completed = true;

        // hide step-2 and show badge question
        document.getElementById("step-2").classList.add("hidden");
        document.getElementById("step-badge").classList.remove("hidden");

        // Start countdown for badge question
        startBadgeCountdown();

        displayFortuneIfAvailableAndStepTwoCompleted();
      }

      function updateSubmitButton() {
        const selectedCount = document.querySelectorAll(
          '#step-2-content input[type="checkbox"]:checked'
        ).length;
        const submitButton = document.getElementById("submit_entropy");

        if (selectedCount >= 3) {
          submitButton.disabled = false;
          submitButton.innerText = "Entropie speichern";
        } else {
          submitButton.disabled = true;
          submitButton.innerText = `Noch ${3 - selectedCount} auswählen`;
        }
      }

      let countdownInterval;

      function startCountdown() {
        let countdown = 10; // seconds
        const restartButton = document.getElementById("restart");
        restartButton.innerText = `Neu starten (${countdown} Sekunden)`;

        countdownInterval = setInterval(() => {
          countdown -= 1;
          if (countdown > 0) {
            restartButton.innerText = `Neu starten (${countdown} Sekunden)`;
          } else {
            clearInterval(countdownInterval);
            restart();
          }
        }, 1000);
      }

      function startBadgeCountdown() {
        let countdown = 10; // seconds
        const badgeNoButton = document.getElementById("badge-no");
        badgeNoButton.innerText = `Nein, Danke (${countdown} Sekunden)`;

        badgeCountdownInterval = setInterval(() => {
          countdown -= 1;
          if (countdown > 0) {
            badgeNoButton.innerText = `Nein, Danke (${countdown} Sekunden)`;
          } else {
            clearInterval(badgeCountdownInterval);
            // Automatically click "No"
            badgeNoButton.click();
          }
        }, 1000);
      }

      function restart() {
        clearInterval(countdownInterval);
        clearInterval(badgeCountdownInterval);
        fortune_text = "";
        step_2_completed = false;
        document.getElementById("step-1").classList.remove("hidden");
        document.getElementById("step-badge").classList.add("hidden");
        document.getElementById("step-qrcode").classList.add("hidden");
        document.getElementById("result").classList.add("hidden");
        fetchEntropyWords().then(renderEntropyWords);
      }

      // Badge button handlers
      document.getElementById("badge-yes").addEventListener("click", function () {
        clearInterval(badgeCountdownInterval);
        document.getElementById("step-badge").classList.add("hidden");
        document.getElementById("step-qrcode").classList.remove("hidden");
        // Check if fortune is already ready
        displayFortuneIfAvailableAndStepTwoCompleted();
      });

      document.getElementById("badge-no").addEventListener("click", function () {
        clearInterval(badgeCountdownInterval);
        document.getElementById("step-badge").classList.add("hidden");
        document.getElementById("loading").classList.remove("hidden");
        // Check if fortune is already ready
        displayFortuneIfAvailableAndStepTwoCompleted();
      });

      document.getElementById("qrcode-continue").addEventListener("click", function () {
        document.getElementById("step-qrcode").classList.add("hidden");
        document.getElementById("loading").classList.remove("hidden");
        // Check if fortune is already ready
        displayFortuneIfAvailableAndStepTwoCompleted();
      });

      document.getElementById("restart").addEventListener("click", function () {
        restart();
      });



      // Fetch zodiacs and render buttons on page load
      fetchZodiacs().then(renderButtons);

      // Fetch entropy words and render checkboxes on page load
      fetchEntropyWords().then(renderEntropyWords);
    </script>
  </body>
</html>
